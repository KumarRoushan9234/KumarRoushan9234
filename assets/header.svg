
<svg width="1400" height="360" viewBox="0 0 1400 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080D"/>
      <stop offset="55%" stop-color="#09111C"/>
      <stop offset="100%" stop-color="#03060A"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50"
            fill="none"
            stroke="#1E293B"
            stroke-width="1"
            opacity="0.45"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1400" height="360" rx="18" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1400" height="360" rx="18" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="1080" cy="180" r="260" fill="url(#glow)" filter="url(#blur)">
    <animate
      attributeName="opacity"
      values="0.35;0.6;0.35"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Network lines -->
  <g stroke="#3B82F6" stroke-width="1" opacity="0.28">

    <line x1="830" y1="70" x2="1010" y2="125"/>
    <line x1="1010" y1="125" x2="1180" y2="75"/>
    <line x1="1010" y1="125" x2="1110" y2="230"/>
    <line x1="1180" y1="75" x2="1300" y2="155"/>
    <line x1="1110" y1="230" x2="1280" y2="260"/>
    <line x1="930" y1="250" x2="1110" y2="230"/>
    <line x1="830" y1="70" x2="930" y2="250"/>

  </g>

  <!-- Network nodes -->
  <g fill="#60A5FA">

    <circle cx="830" cy="70" r="3">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1010" cy="125" r="4">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="3.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1180" cy="75" r="3">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="2.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1110" cy="230" r="4">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="3.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1280" cy="260" r="3">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="2.6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="930" cy="250" r="3">
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- KR Logo -->
  <g transform="translate(90 80)">

    <path
      d="M0 80 L40 0 L82 0 L48 80 Z"
      fill="url(#blue)"/>

    <path
      d="M35 48 L85 80 L55 80 L10 48 Z"
      fill="#93C5FD"/>

    <path
      d="M45 35 L78 5 L105 5 L65 48 Z"
      fill="#2563EB"/>

    <path
      d="M58 48 L105 80 L78 80 L40 55 Z"
      fill="#60A5FA"/>

  </g>

  <!-- Main identity -->
  <text x="250"
        y="120"
        fill="#F8FAFC"
        font-family="Inter, Arial, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="-1">
    KUMAR ROUSHAN
  </text>

  <text x="254"
        y="165"
        fill="#93C5FD"
        font-family="JetBrains Mono, monospace"
        font-size="22"
        font-weight="500"
        letter-spacing="6">
    AI PRODUCT ENGINEER
  </text>

  <!-- Divider -->
  <line x1="254" y1="195" x2="750" y2="195"
        stroke="#2563EB"
        stroke-width="2"
        opacity="0.7"/>

  <!-- Focus -->
  <text x="254"
        y="235"
        fill="#CBD5E1"
        font-family="JetBrains Mono, monospace"
        font-size="15"
        letter-spacing="2">
    SEARCH
  </text>

  <text x="340"
        y="235"
        fill="#475569"
        font-family="JetBrains Mono, monospace"
        font-size="15">
    |
  </text>

  <text x="370"
        y="235"
        fill="#CBD5E1"
        font-family="JetBrains Mono, monospace"
        font-size="15"
        letter-spacing="2">
    AGENTS
  </text>

  <text x="465"
        y="235"
        fill="#475569"
        font-family="JetBrains Mono, monospace"
        font-size="15">
    |
  </text>

  <text x="495"
        y="235"
        fill="#CBD5E1"
        font-family="JetBrains Mono, monospace"
        font-size="15"
        letter-spacing="2">
    INFRASTRUCTURE
  </text>

  <text x="665"
        y="235"
        fill="#475569"
        font-family="JetBrains Mono, monospace"
        font-size="15">
    |
  </text>

  <text x="695"
        y="235"
        fill="#CBD5E1"
        font-family="JetBrains Mono, monospace"
        font-size="15"
        letter-spacing="2">
    APIs
  </text>

  <!-- Tagline -->
  <text x="254"
        y="285"
        fill="#64748B"
        font-family="JetBrains Mono, monospace"
        font-size="14">
    Building infrastructure for AI applications and agents.
  </text>

  <!-- Right-side labels -->
  <g font-family="JetBrains Mono, monospace"
     font-size="12"
     fill="#64748B"
     letter-spacing="2">

    <text x="1170" y="105">SEARCH</text>
    <text x="1170" y="130">AGENTS</text>
    <text x="1170" y="155">BROWSERS</text>
    <text x="1170" y="180">RETRIEVAL</text>
    <text x="1170" y="205">PLATFORMS</text>

  </g>

  <!-- Animated pulse -->
  <circle cx="1080" cy="180"
          r="7"
          fill="none"
          stroke="#60A5FA"
          stroke-width="1.5">

    <animate
      attributeName="r"
      values="7;24;7"
      dur="3s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.8;0;0.8"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

  <!-- Bottom accent -->
  <rect x="90" y="330" width="1220" height="1"
        fill="#1E293B"/>

  <rect x="90" y="330" width="220" height="1"
        fill="#3B82F6">

    <animate
      attributeName="width"
      values="180;320;180"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

</svg>
